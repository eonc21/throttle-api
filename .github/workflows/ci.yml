name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
  build:
    uses: ./.github/workflows/build.yml
